services:
  # Vite React App
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vite-react-dev
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000/
    networks:
      - vite-network

volumes:
  node_modules:

networks:
  vite-network:
    driver: bridge

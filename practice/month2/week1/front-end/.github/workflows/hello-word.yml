name: Hello Word

on: push

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello, Github Actions!"

      - name: Print Date
        run: date

      - name: List Files
        run: ls -la

      - name: Show Enviroment
        run: |
          echo "GitHub Actor: ${{ github.actor}}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
